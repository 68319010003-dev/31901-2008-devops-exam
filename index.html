<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Final Exam - Student Evaluation System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #2a5298;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .pass { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center;"><span class="badge">DevOps CI/CD App</span></div>
    <h2>ระบบประเมินผลสอบ</h2>
    
    <div class="form-group">
        <label for="score">กรอกคะแนนสอบ (0 - 100):</label>
        <input type="number" id="score" min="0" max="100" placeholder="ตัวอย่าง: 75">
    </div>

    <button onclick="evaluateScore()">ประเมินผล</button>

    <div id="result"></div>
</div>

<script>
    function evaluateScore() {
        const scoreInput = document.getElementById('score').value;
        const resultDiv = document.getElementById('result');
        
        if (scoreInput === '' || scoreInput < 0 || scoreInput > 100) {
            alert('กรุณากรอกคะแนนระหว่าง 0 ถึง 100');
            return;
        }

        const score = parseFloat(scoreInput);
        resultDiv.style.display = 'block';

        if (score >= 50) {
            resultDiv.className = 'pass';
            resultDiv.innerHTML = `ยินดีด้วย! คุณสอบผ่าน 🎉<br>คะแนนของคุณคือ: ${score}`;
        } else {
            resultDiv.className = 'fail';
            resultDiv.innerHTML = `เสียใจด้วย คุณสอบไม่ผ่าน ❌<br>คะแนนของคุณคือ: ${score}`;
        }
    }
</script>

</body>
</html>
